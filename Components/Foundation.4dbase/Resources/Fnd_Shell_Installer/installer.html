<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{heading}}</title>
<style>
:root {
	color-scheme: light dark;
	--panel: #F4F4F4;
	--fg: #333;
	--rule: #d6d6d6;
	--heading: #63412D;
	--copper: #A27249;
	--code-bg: #e8e8e8;
	--muted: #5a5a5a;
}
@media (prefers-color-scheme: dark) {
	:root {
		--panel: #2a2a2a;
		--fg: #e4e4e4;
		--rule: #444;
		--heading: #D2A27A;
		--code-bg: #383838;
		--muted: #bbb;
	}
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--panel); }
html { overflow-x: hidden; }
body {
	padding: 1rem 1.25rem 1.5rem;
	color: var(--fg);
	font-family: Verdana, Geneva, sans-serif;
	font-size: 13px;
	line-height: 1.5;
	overflow-x: hidden;
	overflow-wrap: anywhere;
}
header {
	display: flex;
	align-items: center;
	gap: 1rem;
	padding-bottom: 0.75rem;
	margin-bottom: 0.75rem;
	border-bottom: 2px solid var(--copper);
}
header img { width: 72px; height: 72px; flex: none; }
h1 {
	margin: 0;
	font-family: Georgia, "Times New Roman", serif;
	font-size: 1.7rem;
	font-weight: normal;
	color: var(--heading);
}
p { margin: 0 0 0.75rem; }
section { margin-top: 1.1rem; }
h2 {
	margin: 0 0 0.15rem;
	padding-bottom: 0.15rem;
	border-bottom: 1px solid var(--rule);
	font-family: Georgia, "Times New Roman", serif;
	font-size: 1.1rem;
	font-weight: normal;
	color: var(--heading);
}
section p { color: var(--muted); font-size: 12px; margin-bottom: 0.4rem; }
ul {
	list-style: none;
	margin: 0;
	padding: 0;
	columns: 19em;
	column-gap: 1rem;
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: 11px;
}
li { padding: 0.05rem 0; break-inside: avoid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ul.changes { columns: auto; list-style: disc; padding-left: 1.2rem; font-family: inherit; font-size: 12px; }
ul.changes li { white-space: normal; overflow: visible; text-overflow: clip; padding: 0.15rem 0; }
ul.wide { columns: auto; }
ul.wide li { white-space: normal; overflow: visible; text-overflow: clip; }
ul.hooks { columns: auto; font-family: inherit; font-size: 12px; }
ul.hooks li.hook { white-space: normal; overflow: visible; text-overflow: clip; padding: 0.3rem 0; border-bottom: 1px solid var(--rule); break-inside: auto; }
.hook-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: bold; }
.hook-note { color: var(--muted); }
ul.hooks input[type=checkbox] { margin-right: 0.35rem; vertical-align: middle; }
ul.hooks details { margin: 0.3rem 0 0 1.4rem; }
ul.hooks summary { cursor: pointer; color: var(--heading); }
ul.hooks h3 { margin: 0.6rem 0 0.2rem; font-size: 12px; font-weight: bold; color: var(--fg); }
.footer { margin-top: 1.25rem; padding-top: 0.6rem; border-top: 1px solid var(--rule); font-size: 11px; color: var(--muted); }
</style>
<style>
{{diffcss}}
</style>
<script>
function chosenHooks() {
	var boxes = document.querySelectorAll("input.fnd-hook-choice:checked");
	var names = [];
	for (var i = 0; i < boxes.length; i++) { names.push(boxes[i].value); }
	return JSON.stringify(names);
}
</script>
</head>
<body>
<header>
<img src="{{logo}}" alt="">
<h1>{{heading}}</h1>
</header>
{{intro}}
{{sections}}
<p class="footer">{{footer}}</p>
</body>
</html>
