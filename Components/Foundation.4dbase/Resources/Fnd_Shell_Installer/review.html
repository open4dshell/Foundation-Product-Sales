<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation</title>
<style>
:root {
	color-scheme: light dark;
	--panel: #F4F4F4;
	--fg: #333;
	--rule: #d6d6d6;
	--heading: #63412D;
	--muted: #5a5a5a;
}
@media (prefers-color-scheme: dark) {
	:root {
		--panel: #2a2a2a;
		--fg: #e4e4e4;
		--rule: #444;
		--heading: #D2A27A;
		--muted: #bbb;
	}
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--panel); }
body {
	padding: 0.75rem 1rem 1.5rem;
	color: var(--fg);
	font-family: Verdana, Geneva, sans-serif;
	font-size: 13px;
	line-height: 1.5;
}
h2 {
	margin: 0 0 0.15rem;
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: 1rem;
	color: var(--heading);
}
h3 { margin: 1rem 0 0.25rem; font-size: 12px; font-weight: bold; }
p.status { margin: 0 0 0.5rem; color: var(--muted); font-size: 12px; }
</style>
<style>
{{diffcss}}
</style>
</head>
<body>
{{body}}
</body>
</html>
